site_name: Aeron in Zig
site_description: Build a wire-compatible Aeron implementation while learning Zig systems programming.
site_url: https://harus-aeron-zig.local/
repo_url: https://github.com/azusachino/harus-aeron-zig
repo_name: harus-aeron-zig
docs_dir: docs
site_dir: site

exclude_docs: |
  audits/1.0.0-rc2-audit.md
  audits/2026-03-23-wire-compatibility.md
  audits/2026-03-24-wire-compatibility-followup.md
  audits/2026-04-17-parity-audit.md
  guides/zig-module-system.md
  investigations/**
  plans/**
  specs/**



theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/radio-tower
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search:
      lang: en
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        tutorial/index.md: tutorial/README.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - .
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aeron-io/aeron
      name: Upstream Aeron

nav:
  - Home: README.md
  - Tutorial:
      - Overview: tutorial/README.md
      - Orientation:
          - What is Aeron: tutorial/00-orientation/01-what-is-aeron.md
          - What is Zig: tutorial/00-orientation/02-what-is-zig.md
          - System Tour: tutorial/00-orientation/03-system-tour.md
          - First Pub/Sub: tutorial/00-orientation/04-first-pubsub.md
      - Foundations:
          - Frame Codec: tutorial/01-foundations/01-frame-codec.md
          - Ring Buffer: tutorial/01-foundations/02-ring-buffer.md
          - Broadcast: tutorial/01-foundations/03-broadcast.md
          - Counters: tutorial/01-foundations/04-counters.md
          - Log Buffer: tutorial/01-foundations/05-log-buffer.md
      - Data Path:
          - Term Appender: tutorial/02-data-path/01-term-appender.md
          - Term Reader: tutorial/02-data-path/02-term-reader.md
          - UDP Transport: tutorial/02-data-path/03-udp-transport.md
      - Driver:
          - Sender: tutorial/03-driver/01-sender.md
          - Receiver: tutorial/03-driver/02-receiver.md
          - Conductor: tutorial/03-driver/03-conductor.md
          - Media Driver: tutorial/03-driver/04-media-driver.md
      - Client:
          - Publications: tutorial/04-client/01-publications.md
          - Subscriptions: tutorial/04-client/02-subscriptions.md
          - Integration Tests: tutorial/04-client/03-integration-tests.md
          - Interop: tutorial/04-client/04-interop.md
      - Archive:
          - Archive Protocol: tutorial/05-archive/01-archive-protocol.md
          - Catalog: tutorial/05-archive/02-catalog.md
          - Recorder: tutorial/05-archive/03-recorder.md
          - Replayer: tutorial/05-archive/04-replayer.md
          - Archive Conductor: tutorial/05-archive/05-archive-conductor.md
          - Archive Main: tutorial/05-archive/06-archive-main.md
          - Archive Parity: tutorial/05-archive/07-parity.md
      - Cluster:
          - Cluster Protocol: tutorial/06-cluster/01-cluster-protocol.md
          - Election: tutorial/06-cluster/02-election.md
          - Log Replication: tutorial/06-cluster/03-log-replication.md
          - Cluster Conductor: tutorial/06-cluster/04-cluster-conductor.md
          - Cluster Main: tutorial/06-cluster/05-cluster-main.md
  - Architecture:
      - Overview: guides/architecture.md
      - Setup: guides/setup.md
  - Reference:
      - Plan: plan.md
      - Release Audit: audits/1.0.0-release-audit.md
      - Course Gap Report: course/lesson-gap-report.md
